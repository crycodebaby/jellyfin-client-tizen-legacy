name: Projektprüfungen

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Entwicklungsabhängigkeiten installieren
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chromium für Browserprüfungen installieren
        run: npx playwright install --with-deps --only-shell chromium
      - name: Medien- und QR-Prüfwerkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-reportlab
          echo "SMAIRYS_TEST_FFMPEG=/usr/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "SMAIRYS_TEST_FFPROBE=/usr/bin/ffprobe" >> "$GITHUB_ENV"
          echo "SMAIRYS_QR_PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"
      - name: Quellcode und Vorschau prüfen
        run: npm test
      - name: Veröffentlichte Historie prüfen
        run: npm run check:public -- HEAD
